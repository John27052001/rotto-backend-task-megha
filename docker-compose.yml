services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rotto
      POSTGRES_USER: rotto
      POSTGRES_PASSWORD: rotto
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotto -d rotto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: